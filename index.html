<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Урок 3</title>
  </head>
  <body>
    <!-- Блочные теги это теги создающие блоки, которые занимают всю
    доступную им ширину. Строчные теги это теги создающие элементы внутри
блока, и занимают они ширину равную их внутреннему содержимому -->
    <!-- Блочные теги можно вкладывать только в блочные, и нельзя вкладывать в строчные -->
    <p>
      Параграф с <b>жирными и <i>курсивным текстом</i></b>
    </p>

    <h1>Я главный заголовок страницы</h1>
    <button>Я кнопка</button>
    <a href="/">Я ссылка</a>
    <p>Я параграф</p>
    <ul>
      <li>Я элемент списка</li>
      <li>Я элемент списка</li>
      <li>Я элемент списка</li>
    </ul>
    <div>Нейтральный блочный тег</div>
    <!-- занимает всю доступную ширину -->
    <span>Нейтральный строчный тег</span>
    <!-- занимает столько места, сколько содержится к нём контента -->
  </body>
</html>
