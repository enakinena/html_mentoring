<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Урок 13</title>
  </head>
  <body>
    <label for="comment">Ваш комментарий:</label>
    <textarea name="user-comment" id="comment">
Статья - топ! Автор, пиши ещё.</textarea
    >
    <br />
    <hr />
    <label for="city">Ваш город:</label>
    <select name="user-city" id="city" multiple>
      <option value="moscow">Москва</option>
      <option value="petersburg">Санкт-Петербург</option>
      <option value="voronezh">Воронеж</option>
    </select>
    <!-- multiple - атрибут добавляют чтобы выбирать более 1-го варианта -->
  </body>
  <hr />
  <br />
  <form action="">
    <label for="city">Ваш город:</label>
    <select name="user-city" id="city" required>
      <option disabled value="" selected>Не выбрано</option>
      <option value="moscow">Москва</option>
      <option value="petersburg">Санкт-Петербург</option>
      <option value="voronezh">Воронеж</option>
    </select>
    <button>Send</button>
  </form>
  <br />
  <br />
  <hr />
  <label for="office">Выберите офис:</label>
  <select name="office" id="office">
    <optgroup label="Центральный район">
      <option value="center-1">ул. Пушкина, д. 2</option>
      <option value="center-2">ул. Ломоносова, д. 15</option>
      <option value="center-3">бул. Победы, д. 3, к.6</option>
    </optgroup>
    <optgroup label="Южный район">
      <option value="south-1">ул. Лама, д. 5</option>
      <option value="south-2">пр. Революции, д. 4</option>
    </optgroup>
  </select>
</html>
