<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Урок 11</title>
  </head>
  <body>
    <!-- action указывают адрес скрипта обработчика расположенного на стороне сервера. -->
    <!-- method указывается метод отправки формы -->
    <!-- <form action="/some-server-script-path" method="post"></form> -->
    <form>
      <fieldset>Группа полей ввода...</fieldset>
      <fieldset>Ещё одна группу полей ввода</fieldset>
      <fieldset>И ещё одна группа полей ввода</fieldset>
    </form>
    <!-- fieldset служит для визуальной группировки нескольких полей ввода в один набор -->
    <br />
    <hr />
    <form>
      <fieldset>
        <legend>Паспортные данные</legend>
        ...
      </fieldset>
      <fieldset>
        <legend>Работа</legend>
        ...
      </fieldset>
      <fieldset>
        <legend>Образование</legend>
        ...
      </fieldset>
      <!-- legend - используется в качестве заголовка внутри тега fieldset -->
    </form>
    <hr />
    <label for="">Логин:</label>
    <!-- label - тег метки к любому интерактивному полю вводу. -->
    <input type="text" />
    <!-- input - тег для пользовательского взаимодействия(ввод данных) -->
    <br />
    <hr />
    <label for="login">Логин:</label>
    <input id="login" name="user-login" type="text" />

    <label for="review">Ваш отзыв:</label>
    <input id="review" name="user-review" value="Отлично" />
  </body>
</html>
