<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Урок 9</title>
  </head>
  <body>
    <video src="video/example.mp4" controls></video>
    <hr />
    <video>
      <source src="video/example.mp4" type="video/mp4" />
      <source src="video/example.webm" type="video/webm" />
      <p>К сожалению, ваш браузер не поддерживает видео</p>
    </video>
    <hr />
    <video src="video/example.mp4" controls width="480" height="270"></video>
    <hr />
    <video
      src="video/example.mp4"
      width="240"
      height="150"
      autoplay
      muted
    ></video>
    <hr />
    <video src="video/example.mp4" controls loop></video>
    <hr />
    <video
      src="video/example.mp4"
      controls
      poster="./images/video-placeholder.jpg"
    ></video>
    <hr />
    <audio controls>
      <source src="./audio/example.mp3" type="audio/mpeg" />
      <p>
        Ваш браузер не поддерживает встроенное аудио. Попробуйте
        <a href="./audio/example.mp3" download>скачать</a> файл.
      </p>
    </audio>
    <hr />
    <!-- Тег iframe позволяет вывести на страницу сайт виджет с каким-то функционалом. -->
    <iframe
      src="https://yandex.ru/map-widget/v1/?um=constructor%3Ae5a2cb1c3faa177fb3b47868c041cc6765319c8dc1a6a6ea8bd936af7c6fb768&amp;source=constructor"
      width="500"
      height="400"
      frameborder="0"
    ></iframe>
    <hr />
    <!-- Встраивание фрейма другого сайта на свой сайт -->
    <iframe src="https://aleksanderlamkov.ru" width="500" height="400"></iframe>
  </body>
</html>
