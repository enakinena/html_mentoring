<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Урок 10</title>
  </head>
  <body>
    <table>
      <!-- Обязательный тег таблицы. Оборачивает все остальные табл. теги -->
    </table>
    <hr />
    <tr>
      <!-- Используется для выделения строк в таблице. Является обязательным.  -->
    </tr>
    <hr />
    <td>
      <!-- Используется в качестве обычной ячейки в таблице. -->
    </td>
    <hr />
    <table border="1">
      <tr>
        <th>Имя</th>
        <th>Номер заявки</th>
      </tr>
      <tr>
        <td>Алексей</td>
        <td>101</td>
      </tr>
      <tr>
        <td>Александр</td>
        <td>102</td>
      </tr>
      <tr>
        <td>Михаил</td>
        <td>103</td>
      </tr>
    </table>
    <hr />
    <table border="1">
      <!-- тег caption указывает общий заголовок таблицы -->
      <caption>
        Рассчётный лист услуг ЖКХ
      </caption>
      <thead>
        <tr>
          <th rowspan="2">Вид услуги</th>
          <th rowspan="2">Ед. изм.</th>
          <th colspan="2">Объём коммунальный услуг</th>
          <th rowspan="2">Размер платы</th>
        </tr>
        <tr>
          <th>на индивид. нужды</th>
          <th>на общедом. нужды</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Холодная вода</td>
          <td>Куб м.</td>
          <td>3</td>
          <td>7</td>
          <td>1000.00</td>
        </tr>
      </tbody>
      <tfoot>
        <tr>
          <td>Итого к оплате за расчётный период</td>
          <td colspan="4">9999.00</td>
        </tr>
      </tfoot>
    </table>
  </body>
</html>
